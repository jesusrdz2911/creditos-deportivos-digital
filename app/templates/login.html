{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="login card">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <p><button style="width:100%">Entrar</button></p>
  </form>
  <p class="demo">Prototipo con datos simulados. Cuentas de prueba (contraseña <code>demo1234</code>):
  <code>alumno1@demo.test</code>, <code>promotor1@demo.test</code>, <code>escolares@demo.test</code></p>
</div>
{% endblock %}
